<!doctype html>
<!--
  Arabic is the site default. Declaring it here rather than waiting for React
  avoids a flash of left-to-right layout on first paint; src/site/i18n.tsx
  takes over and switches both attributes for a visitor who chooses another.
  Kurdish is right-to-left too, so only English changes the direction here.

  The tags below are English because a link preview and a search result are
  rendered by a crawler, not by a visitor, and the crawler never runs the
  language switch. English is the one all three audiences can act on, and the
  hreflang tags say the same URL serves Arabic and Kurdish as well.

  Everywhere the host appears below it also appears in public/robots.txt and
  public/sitemap.xml. Moving to a real domain means changing it in all three.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CoreOs — Websites, apps, systems and AI for business</title>
    <meta
      name="description"
      content="CoreOs builds websites, apps, automated systems and business AI for small and mid-sized companies — from the smallest tech need to the biggest system, built fast and priced for what you actually need. 31 AI agents open for public testing. Serving Erbil and Iraq in Arabic, Kurdish and English."
    />
    <link rel="canonical" href="https://coreosai.netlify.app/" />
    <meta name="theme-color" content="#05060a" />

    <!-- One URL serves all three languages; these say so rather than letting a
         crawler assume the site is Arabic-only. -->
    <link rel="alternate" hreflang="ar" href="https://coreosai.netlify.app/" />
    <link rel="alternate" hreflang="ckb" href="https://coreosai.netlify.app/" />
    <link rel="alternate" hreflang="en" href="https://coreosai.netlify.app/" />
    <link rel="alternate" hreflang="x-default" href="https://coreosai.netlify.app/" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2305060a'/%3E%3Ccircle cx='50' cy='50' r='34' fill='%23edf2e4'/%3E%3Cpath d='M84 50C60 40 49 35 37 24C47 40 47 60 37 76C49 65 60 60 84 50Z' fill='%2305060a'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="/og.png" />

    <!-- Link previews. Most of CoreOs's traffic arrives as a link pasted into
         WhatsApp or a social post, so this is the first thing most prospects
         see of the company. og:image must be an absolute URL — a relative one
         is silently dropped by every scraper. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CoreOs" />
    <meta property="og:url" content="https://coreosai.netlify.app/" />
    <meta property="og:title" content="CoreOs — Websites, apps, systems and AI for business" />
    <meta
      property="og:description"
      content="From the smallest tech need to the biggest system. Built fast, priced for what you actually need — and 31 AI agents you can test for free, right now."
    />
    <meta property="og:image" content="https://coreosai.netlify.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CoreOs — websites, apps and systems. Built fast, priced fairly." />
    <meta property="og:locale" content="ar_IQ" />
    <meta property="og:locale:alternate" content="ckb_IQ" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CoreOs — Websites, apps, systems and AI for business" />
    <meta
      name="twitter:description"
      content="From the smallest tech need to the biggest system. Built fast, priced for what you actually need."
    />
    <meta name="twitter:image" content="https://coreosai.netlify.app/og.png" />

    <!-- Tells a search engine that CoreOs is a company rather than just a page,
         and lists the names people actually type. "CoreOS" alone belongs to a
         well-known Linux distribution, so the variations matter here. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://coreosai.netlify.app/#organization",
            "name": "CoreOs",
            "alternateName": ["CoreOs.ai", "CoreOs AI", "coreOs", "كور أو إس"],
            "url": "https://coreosai.netlify.app/",
            "logo": "https://coreosai.netlify.app/og.png",
            "image": "https://coreosai.netlify.app/og.png",
            "description": "CoreOs builds websites, apps, automated systems and affordable business AI for small and mid-sized companies.",
            "slogan": "Where your needs meet reality.",
            "email": "coreosgmail.com@gmail.com",
            "telephone": "+9647706094646",
            "areaServed": [
              { "@type": "Country", "name": "Iraq" },
              { "@type": "City", "name": "Erbil" }
            ],
            "knowsLanguage": ["ar", "ckb", "en"],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "sales",
              "telephone": "+9647706094646",
              "email": "coreosgmail.com@gmail.com",
              "availableLanguage": ["Arabic", "Kurdish", "English"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://coreosai.netlify.app/#website",
            "url": "https://coreosai.netlify.app/",
            "name": "CoreOs",
            "alternateName": "CoreOs.ai",
            "publisher": { "@id": "https://coreosai.netlify.app/#organization" },
            "inLanguage": ["ar", "ckb", "en"]
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://coreosai.netlify.app/#service",
            "name": "CoreOs",
            "parentOrganization": { "@id": "https://coreosai.netlify.app/#organization" },
            "url": "https://coreosai.netlify.app/",
            "areaServed": { "@type": "Country", "name": "Iraq" },
            "availableLanguage": ["Arabic", "Kurdish", "English"],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "What CoreOs builds",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website design and development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile and web app development" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business systems and automation" } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI agents for business" } }
              ]
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
