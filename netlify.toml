[build]
  command = "npm run build:web"
  publish = "dist"
  functions = "netlify/functions"

# The agent sandbox. Must come before the SPA catch-all below, or the
# catch-all would swallow it and return index.html instead.
[[redirects]]
  from = "/api/lab/chat"
  to = "/.netlify/functions/lab-chat"
  status = 200

# Open this when the agents go quiet: it says why, rather than leaving the
# browser's one generic message to cover every possible cause.
[[redirects]]
  from = "/api/lab/health"
  to = "/.netlify/functions/lab-health"
  status = 200

# Change the model or the key without a deploy. /admin is the page; the
# settings path is the API behind it. Both refuse everything unless ADMIN_TOKEN
# is set in the site's environment variables.
[[redirects]]
  from = "/api/lab/settings"
  to = "/.netlify/functions/lab-settings"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/lab-admin"
  status = 200

# Client-side routing: every other path serves the app shell so /mission,
# /coreos-ai, /contact and friends survive a refresh or a shared link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
