[build]
  command = "npm run build:web"
  publish = "dist"
  functions = "netlify/functions"

# The agent sandbox. Must come before the SPA catch-all below, or the
# catch-all would swallow it and return index.html instead.
[[redirects]]
  from = "/api/lab/chat"
  to = "/.netlify/functions/lab-chat"
  status = 200

# What the responder thinks it is configured to do. Worth having on Netlify
# and not only on the Express server: without it the URL falls through to the
# SPA catch-all and answers with the site's 404 page, which reads as a broken
# deploy rather than a missing route.
[[redirects]]
  from = "/api/inbox/status"
  to = "/.netlify/functions/inbox-status"
  status = 200

# The "Stop it" / "Send now" links in the inbox responder's notification email.
# Its sibling, inbox-scan, is deliberately absent: it declares a schedule in
# code, and Netlify does not expose scheduled functions over HTTP in
# production. The cron is its only trigger.
[[redirects]]
  from = "/api/inbox/action"
  to = "/.netlify/functions/inbox-action"
  status = 200

# Client-side routing: every other path serves the app shell so /mission,
# /coreos-ai, /contact and friends survive a refresh or a shared link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
