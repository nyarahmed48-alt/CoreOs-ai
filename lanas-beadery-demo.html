  html { scroll-behavior: smooth; }

  section { border-bottom: 1px solid var(--line); }

  nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 10px; padding-bottom: 10px; }

  .langs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
  .langs button { border: 0; background: none; cursor: pointer; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--muted); }

  .btn.solid { background: var(--sage-deep); color: #fff; }
  .btn.solid:hover { opacity: .9; }
  .btn.ghost { border: 1.5px solid var(--sage); color: var(--sage-deep); }
  .btn.ghost:hover { background: var(--mint); }

  header.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
  .dots span { position: absolute; border-radius: 50%; opacity: .6; pointer-events: none; }
  .hero .wrap { position: relative; display: grid; gap: 48px; padding-top: 64px; padding-bottom: 64px; }

  .kicker { display: flex; align-items: center; gap: 8px; color: var(--sage-deep); font-size: 12px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }

  .tagline { margin-top: 20px; font-size: 19px; font-weight: 600; line-height: 1.6; }
  .intro { margin-top: 12px; font-size: 15.5px; line-height: 1.7; color: var(--muted); }
  .ctas { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
  .badges { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 8px; }

  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card .pic svg.b { display: block; width: 100%; height: 100%; transition: transform .5s; }

  .price { flex-shrink: 0; font-weight: 700; color: var(--sage-deep); font-variant-numeric: tabular-nums; }

  .custom { display: grid; gap: 32px; border-radius: 32px; padding: 40px 24px; background: var(--mint); }

  .custom h2 { margin-top: 16px; }
  .custom .body { margin-top: 12px; font-size: 15.5px; line-height: 1.7; color: var(--muted); }

  .steps .top { display: flex; align-items: center; gap: 12px; color: var(--sage-deep); font-size: 20px; }

  .center { margin-top: 40px; display: flex; justify-content: center; }

  footer .line { margin-top: 12px; font-size: 13.5px; color: var(--muted); }

  .chat { position: fixed; bottom: 16px; right: 16px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }

  .fab { position: relative; display: flex; width: 64px; height: 64px; align-items: center; justify-content: center; border: 0; border-radius: 50%; cursor: pointer; color: #fff; font-size: 28px; background: linear-gradient(135deg, var(--sage), var(--sage-deep)); box-shadow: 0 10px 30px -6px rgba(111,143,69,.6); transition: transform .2s; }

  .fab .ai { position: absolute; top: -2px; right: -2px; display: flex; width: 24px; height: 24px; align-items: center; justify-content: center; border-radius: 50%; background: var(--pink); color: #fff; font-size: 10px; font-weight: 800; box-shadow: 0 0 0 2px #fff; }
  .panel { display: flex; flex-direction: column; overflow: hidden; width: min(22rem, calc(100vw - 2rem)); height: min(34rem, calc(100dvh - 7.5rem)); border-radius: 24px; background: #fff; border: 1px solid var(--line); box-shadow: 0 18px 50px -12px rgba(63,74,51,.35); }

  .panel .av { display: flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: 50%; background: #fff; color: var(--sage-deep); font-size: 20px; flex-shrink: 0; }

  .panel .who b { display: block; font-size: 14.5px; }
  .panel .who span { font-size: 11.5px; opacity: .9; }
  .panel .x { border: 0; background: none; color: #fff; cursor: pointer; padding: 6px; border-radius: 50%; font-size: 16px; display: flex; }
  .panel .x:hover { background: rgba(255,255,255,.2); }
  .log { flex: 1; overflow-y: auto; padding: 16px; background: var(--paper); display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; border-radius: 16px; padding: 8px 14px; font-size: 14px; line-height: 1.6; }

  .sugs button:hover { background: var(--mint); }
  .panel form { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px; }
  .panel input { flex: 1; min-width: 0; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 10px 16px; font-size: 14px; outline: none; }

  .panel form button { display: flex; width: 40px; height: 40px; align-items: center; justify-content: center; flex-shrink: 0; border: 0; border-radius: 50%; background: var(--sage-deep); color: #fff; cursor: pointer; font-size: 16px; }
  [dir=rtl] .panel form button svg { transform: scaleX(-1); }
  .made { padding: 0 12px 10px; text-align: center; font-size: 11.5px; color: var(--muted); }
  .made b { color: var(--sage-deep); }
</style>
</head>

const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);

/* The focal bead at the bottom of a strand, centred on (0, 0). */
function charm(kind) {
  if (kind === "strawberry") {
    const seeds = [[-4, 0], [4, 0], [0, 4], [-5, 5], [5, 5], [0, -2], [0, 9]]
      .map(([x, y]) => '<ellipse cx="' + x + '" cy="' + y + '" rx="0.9" ry="1.4" fill="#ffe7a8"/>').join("");
    return '<path d="M0 13 C -13 5, -13 -8, 0 -7 C 13 -8, 13 5, 0 13 Z" fill="#e8364a"/>' +
      '<path d="M-7 -8 L -2 -5 L 0 -11 L 2 -5 L 7 -8 L 3 -3 L -3 -3 Z" fill="#4f9a3a"/>' + seeds;
  }
  if (kind === "lemon") {
    const segs = [0, 45, 90, 135].map((a) => {
      const r = (a * Math.PI) / 180, x = 8.5 * Math.cos(r), y = 8.5 * Math.sin(r);
      return '<line x1="' + -x + '" y1="' + -y + '" x2="' + x + '" y2="' + y + '" stroke="#fff4d6" stroke-width="1.2"/>';
    }).join("");
    return '<circle r="12" fill="#f58a1f"/><circle r="10" fill="#fff4d6"/><circle r="8.5" fill="#fcb53b"/>' + segs;
  }
  if (kind === "heart") return '<path d="M0 11 C -16 0, -9 -13, 0 -5 C 9 -13, 16 0, 0 11 Z" fill="#ea6f8a" stroke="#fff" stroke-width="1.5"/>';
  if (kind === "flower") {
    return [0, 72, 144, 216, 288].map((a) =>
      '<ellipse cx="0" cy="-6.5" rx="4.6" ry="6.5" fill="#fff" stroke="#e4e8dc" stroke-width="0.8" transform="rotate(' + a + ')"/>').join("") +
      '<circle r="4" fill="#f7c948"/>';
  }
  return "";
}

/* A bracelet: a ring of beads with its charm at the bottom. The name
   bracelet swaps the bottom few beads for lettered cubes instead. */
function bracelet(p) {
  const COUNT = 30, R = 62, bottom = Math.PI / 2;
  const gap = p.charm === "none" ? 0 : p.charm === "name" ? 0.62 : 0.26;
  let out = '<svg class="b" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="' + R + '" fill="none" stroke="#d8d2c4"/>';
  for (let i = 0; i < COUNT; i++) {
    const a = bottom + (i / COUNT) * Math.PI * 2;
    const off = Math.atan2(Math.sin(a - bottom), Math.cos(a - bottom));
    if (Math.abs(off) < gap) continue;
    out += '<g transform="translate(' + (100 + R * Math.cos(a)) + " " + (100 + R * Math.sin(a)) + ')">' +
      '<circle r="7" fill="' + p.beads[i % p.beads.length] + '" stroke="rgba(0,0,0,0.08)" stroke-width="0.8"/>' +
      '<circle cx="-2.2" cy="-2.4" r="2" fill="#fff" opacity="0.7"/></g>';
  }
  if (p.charm === "name") {
    const letters = "LANA";
    for (let k = 0; k < letters.length; k++) {
      // SVG angles run clockwise, which is right-to-left along the bottom,
      // so step backwards to keep the name reading left to right.
      const a = bottom - (k - (letters.length - 1) / 2) * 0.3;
      out += '<g transform="translate(' + (100 + R * Math.cos(a)) + " " + (100 + R * Math.sin(a)) + ") rotate(" + ((a - bottom) * 180) / Math.PI + ')">' +
        '<rect x="-8" y="-8" width="16" height="16" rx="3" fill="#fff" stroke="#d9d4c7"/>' +
        '<text y="4.5" text-anchor="middle" font-size="11" font-weight="700" fill="' + INK + '" font-family="Inter, sans-serif">' + letters[k] + "</text></g>";
    }
  } else {
    out += '<g transform="translate(100 ' + (100 + R + 2) + ')">' + charm(p.charm) + "</g>";
  }
  return out + "</svg>";
}

/* ---- The AI assistant: a mock-up only. It shows a sample exchange and
   answers anything typed with a note that it is not switched on yet.
   Nothing is sent anywhere. ---- */
const chat = { open: false, lines: [
  { from: "bot", text: DATA.chat.greeting },
  { from: "user", text: DATA.chat.sampleQ },
  { from: "bot", text: DATA.chat.sampleA },
] };
let pending;

function renderChat() {
  const C = DATA.chat;
  const root = document.getElementById("chat");
  const old = root.querySelector("input");
  const draft = old ? old.value : "";
  root.innerHTML =
    '<div class="panel" role="dialog" aria-label="' + c(C.title) + '"' + (chat.open ? "" : " hidden") + ">" +
      '<div class="head"><span class="av">' + icon("bot") + '</span><div class="who"><b>' + c(C.title) + "</b><span>" + c(C.status) + "</span></div>" +
      '<button type="button" class="x" data-close aria-label="' + c(C.close) + '">' + icon("x") + "</button></div>" +
      '<div class="log">' + chat.lines.map((l) =>
        '<p class="msg ' + l.from + '">' + (typeof l.text === "string" ? esc(l.text) : c(l.text)) + "</p>").join("") + "</div>" +
      '<div class="sugs">' + C.suggestions.map((s, i) => '<button type="button" data-sug="' + i + '">' + c(s) + "</button>").join("") + "</div>" +
      '<form><input placeholder="' + c(C.placeholder) + '" aria-label="' + c(C.placeholder) + '">' +
      '<button type="submit" aria-label="' + c(C.send) + '">' + icon("send") + "</button></form>" +
      '<p class="made" dir="ltr">Made by <b>CoreOs.ai</b></p>' +
    "</div>" +
    '<button type="button" class="fab" data-toggle aria-expanded="' + chat.open + '" aria-label="' + (chat.open ? c(C.close) : c(C.open)) + '">' +
      icon(chat.open ? "x" : "bot") + (chat.open ? "" : '<span class="ai">AI</span>') + "</button>";

  const input = root.querySelector("input");
  input.value = draft;
  const log = root.querySelector(".log");
  log.scrollTop = log.scrollHeight;

  root.querySelector("[data-toggle]").onclick = () => {
    chat.open = !chat.open;
    renderChat();
    if (chat.open) root.querySelector("input").focus();
  };
  root.querySelector("[data-close]").onclick = () => { chat.open = false; renderChat(); };
  root.querySelectorAll("[data-sug]").forEach((b) => (b.onclick = () => say(C.suggestions[+b.dataset.sug][lang])));
  root.querySelector("form").onsubmit = (e) => { e.preventDefault(); say(input.value); };
}

function say(text) {
  const clean = text.trim();
  if (!clean) return;
  chat.lines.push({ from: "user", text: clean });
  document.querySelector("#chat input").value = "";
  renderChat();
  document.querySelector("#chat input").focus();
  clearTimeout(pending);
  pending = setTimeout(() => { chat.lines.push({ from: "bot", text: DATA.chat.demoReply }); renderChat(); }, 700);
}

function setLang(next) {
  lang = next;
  try { localStorage.setItem("lanas.lang", next); } catch (e) {}
  document.documentElement.lang = next;
  document.documentElement.dir = next === "en" ? "ltr" : "rtl";
  renderPage();
  renderChat();
}

setLang(lang);
</script>
