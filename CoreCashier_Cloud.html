fused. Details say which, never the credential.",text:{en:{title:"The code was not accepted",body:"The code or password that was entered did not work on this tablet.",steps:["Check it and type it again.","Ask CoreOS for a new code, reading out this one's number."]},ar:{title:"لم يُقبل الرمز",body:"الرمز أو كلمة المرور التي أُدخلت لا تعمل على هذا الجهاز.",steps:["تحقق منها وأدخلها مرة أخرى.","اطلب من CoreOs رمزاً جديداً واذكر رقم هذا الجهاز."]},ckb:{title:"کۆدەکە وەرنەگیرا",body:"ئەو کۆد یان وشە نهێنییەی نووسرا لەسەر ئەم ئامێرە کار ناکات.",steps:["بیپشکنە و دووبارە بینووسە.","داوای کۆدێکی نوێ لە CoreOs بکە و ژمارەی ئەم ئامێرە بڵێ."]}}},"SW-07":{priority:"P1",note:"A write was refused because the till is read-only: licence lapsed, or stopped from the office.",text:{en:{title:"The till is read-only",body:"This tablet cannot take new sales at the moment. Everything you have recorded is still here and can be looked at and saved.",steps:["Look at and export your figures as usual.","Call CoreOS to start selling again."]},ar:{title:"الصندوق للقراءة فقط",body:"لا يستطيع هذا الجهاز تسجيل مبيعات جديدة حالياً. كل ما سجّلته موجود ويمكن الاطلاع عليه وحفظه.",steps:["اطّلع على أرقامك واحفظ نسخة كالمعتاد.","اتصل بـ CoreOs لإعادة البيع."]},ckb:{title:"سندوقەکە تەنها بۆ خوێندنەوەیە",body:"ئێستا ئەم ئامێرە ناتوانێت فرۆشتنی نوێ تۆمار بکات. هەموو ئەوەی تۆمارت کردووە لێرەیە و دەتوانرێت ببینرێت و پاشەکەوت بکرێت.",steps:["وەک هەمیشە ژمارەکانت ببینە و پاشەکەوتیان بکە.","بۆ گەڕانەوەی فرۆشتن پەیوەندی بە CoreOs بکە."]}}},"SW-08":{priority:"P2",note:"The service worker failed to install or activate a new build. The old one keeps serving.",text:{en:{title:"The update did not finish",body:"A new version could not be installed. The till is still working on the version it had.",steps:["Close the app and open it again when the shop is quiet.","Tell CoreOS if it keeps asking."]},ar:{title:"لم يكتمل التحديث",body:"تعذّر تثبيت نسخة جديدة. الصندوق يعمل بالنسخة السابقة.",steps:["أغلق البرنامج وافتحه عندما يهدأ المحل.","أخبر CoreOs إذا تكرر الطلب."]},ckb:{title:"نوێکردنەوەکە تەواو نەبوو",body:"نەتوانرا وەشانێکی نوێ دابمەزرێت. سندوقەکە بە وەشانی پێشوو کاردەکات.",steps:["کاتێک دوکان هێمن بوو بەرنامەکە دابخە و بیکەرەوە.","ئەگەر بەردەوام داوای کرد بە CoreOs بڵێ."]}}},"SW-09":{priority:"P2",note:"Caught exception with no more specific code. Details carry the message.",text:{en:{title:"Something went wrong",body:"The till ran into a problem it could not name. Your sales and products are safe.",steps:["Try what you were doing once more.","If it happens again, call CoreOS and read out this code."]},ar:{title:"حدث خلل",body:"واجه الصندوق مشكلة لم يستطع تحديدها. مبيعاتك وموادك بأمان.",steps:["أعد المحاولة مرة أخرى.","إذا تكرر، اتصل بـ CoreOs واقرأ هذا الرمز."]},ckb:{title:"کێشەیەک ڕوویدا",body:"سندوقەکە تووشی کێشەیەک بوو کە نەیتوانی ناوی بنێت. فرۆشتن و کاڵاکانت پارێزراون.",steps:["دووبارە هەوڵ بدەرەوە.","ئەگەر دووبارە بووەوە، پەیوەندی بە CoreOs بکە."]}}},"DT-01":{priority:"P1",note:"Storage read or write failed: IndexedDB would not open, a transaction aborted, localStorage is blocked, or the migration count check failed.",text:{en:{title:"The tablet is not saving",body:"The till cannot read or write its records on this tablet, so new sales may not be kept.",steps:["Stop selling on this tablet and call CoreOS now.","Do not clear the browser or the app's data."]},ar:{title:"الجهاز لا يحفظ",body:"لا يستطيع الصندوق قراءة أو كتابة سجلاته على هذا الجهاز، وقد لا تُحفظ المبيعات الجديدة.",steps:["أوقف البيع على هذا الجهاز واتصل بـ CoreOs فوراً.","لا تمسح بيانات المتصفح أو البرنامج."]},ckb:{title:"ئامێرەکە پاشەکەوت ناکات",body:"سندوقەکە ناتوانێت تۆمارەکانی لەسەر ئەم ئامێرە بخوێنێتەوە یان بنووسێت، لەوانەیە فرۆشتنی نوێ پارێزراو نەبێت.",steps:["وازبهێنە لە فرۆشتن لەسەر ئەم ئامێرە و یەکسەر پەیوەندی بە CoreOs بکە.","داتای وێبگەڕ یان بەرنامەکە مەسڕەوە."]}}},"DT-02":{priority:"P2",note:"Cloud push or standing check failed. Offline is logged but never shown — it is the normal state here.",text:{en:{title:"The day has not reached CoreOS",body:"The till could not send its books up. It keeps selling, and will send them when the internet comes back.",steps:["Check the wifi when you get a moment.","Nothing is lost; the till will catch up by itself."]},ar:{title:"لم تصل مبيعات اليوم إلى CoreOs",body:"لم يستطع الصندوق رفع دفاتره. يستمر البيع، وسيرفعها عند عودة الإنترنت.",steps:["تحقق من الواي فاي عندما تستطيع.","لا شيء يضيع، سيُكمل الصندوق وحده."]},ckb:{title:"ڕۆژەکە نەگەیشتووەتە CoreOs",body:"سندوقەکە نەیتوانی دەفتەرەکانی بنێرێت. فرۆشتن بەردەوامە و کاتێک ئینتەرنێت گەڕایەوە دەیاننێرێت.",steps:["کاتێک دەرفەتت هەبوو وایفایەکە بپشکنە.","هیچ لەدەست ناچێت، سندوقەکە خۆی تەواوی دەکات."]}}},"DT-03":{priority:"P2",note:"Backup could not be written, or a restore file was rejected as not a till backup.",text:{en:{title:"The backup did not work",body:"The copy of your records could not be saved or could not be read back.",steps:["Try again from Settings, Backup.","Make sure there is room on the tablet.","Call CoreOS if it fails twice."]},ar:{title:"لم تنجح النسخة الاحتياطية",body:"تعذّر حفظ نسخة من سجلاتك أو قراءتها.",steps:["أعد المحاولة من «الإعدادات» ثم «النسخة الاحتياطية».","تأكد من وجود مساحة في الجهاز.","اتصل بـ CoreOs إذا فشلت مرتين."]},ckb:{title:"پاڵپشتەکە سەرکەوتوو نەبوو",body:"نەتوانرا کۆپییەک لە تۆمارەکانت پاشەکەوت بکرێت یان بخوێندرێتەوە.",steps:["لە «ڕێکخستن» و «پاڵپشت» دووبارە هەوڵ بدە.","دڵنیابە شوێنی بەتاڵ لە ئامێرەکەدا هەیە.","ئەگەر دوو جار شکستی هێنا پەیوەندی بە CoreOs بکە."]}}},"DT-04":{priority:"P3",manual:!0,note:"Raised by hand when a cashier entered a wrong price, quantity or name. No browser can see this.",text:{en:{title:"Something was entered wrongly",body:"A price, a count or a name was put in wrongly and needs correcting.",steps:["Correct it in Products or void the sale.","Call CoreOS with this code if you need the records changed."]},ar:{title:"أُدخلت بيانات خاطئة",body:"سعر أو عدد أو اسم أُدخل بشكل خاطئ ويحتاج تصحيحاً.",steps:["صحّحه من «المواد» أو ألغِ الفاتورة.","اتصل بـ CoreOs بهذا الرمز إذا احتجت تعديل السجلات."]},ckb:{title:"زانیاری هەڵە نووسراوە",body:"نرخ یان ژمارە یان ناوێک بە هەڵە نووسراوە و پێویستی بە ڕاستکردنەوەیە.",steps:["لە «کاڵاکان» ڕاستی بکەرەوە یان فرۆشتنەکە بسڕەوە.","ئەگەر پێویستت بە گۆڕینی تۆمارەکانە بە ئەم کۆدە پەیوەندی بکە."]}}},"DT-05":{priority:"P3",note:"A data export was asked for. Logged whether it worked or not, so a shop asking where its file went can be answered.",text:{en:{title:"Data export",body:"A copy of your records was asked for.",steps:["Look in the tablet's Downloads folder.","Call CoreOS with this code if the file is not there."]},ar:{title:"تصدير البيانات",body:"طُلبت نسخة من سجلاتك.",steps:["ابحث في مجلد التنزيلات في الجهاز.","اتصل بـ CoreOs بهذا الرمز إذا لم يكن الملف موجوداً."]},ckb:{title:"ناردنەدەرەوەی داتا",body:"داوای کۆپییەک لە تۆمارەکانت کراوە.",steps:["لە بوخچەی داگرتنەکانی ئامێرەکە بگەڕێ.","ئەگەر فایلەکە نەبوو بە ئەم کۆدە پەیوەندی بکە."]}}},"DT-09":{priority:"P2",note:"A data problem with no more specific code.",text:{en:{title:"A problem with the records",body:"Something about the saved records is not right.",steps:["Save a backup from Settings now.","Call CoreOS and read out this code."]},ar:{title:"مشكلة في السجلات",body:"هناك خلل في السجلات المحفوظة.",steps:["احفظ نسخة احتياطية من «الإعدادات» الآن.","اتصل بـ CoreOs واقرأ هذا الرمز."]},ckb:{title:"کێشە لە تۆمارەکان",body:"شتێک لە تۆمارە پاشەکەوتکراوەکان ڕاست نییە.",steps:["ئێستا لە «ڕێکخستن» پاڵپشتێک پاشەکەوت بکە.","پەیوەندی بە CoreOs بکە و ئەم کۆدە بخوێنەوە."]}}},"AC-01":{priority:"P2",note:"Camera unavailable: no device, permission refused, the getUserMedia watchdog fired, or a photo decoded to nothing.",text:{en:{title:"The scanner is not reading",body:"The camera could not be used to read barcodes.",steps:["Use the hand scanner, or type the number.","Close the app and open it again.","Call CoreOS with this code if it stays."]},ar:{title:"القارئ لا يقرأ",body:"تعذّر استخدام الكاميرا لقراءة الباركود.
