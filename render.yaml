# Render blueprint — deploys CoreOS without Google Cloud.
#
# Render is click-driven: connect this repository at https://render.com, and it
# reads this file for the build and start commands. It injects $PORT, which the
# server honours (see server.ts).
#
# The OpenRouter key is marked sync:false so it is never committed — set both
# values in the Render dashboard after the first deploy.
services:
  - type: web
    name: coreos
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
