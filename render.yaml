# Render blueprint — deploys CoreOS without Google Cloud.
#
# Render is click-driven: connect this repository at https://render.com, and it
# reads this file for the build and start commands. It injects $PORT, which the
# server honours (see server.ts).
#
# The provider keys are marked sync:false so they are never committed — set
# their values in the Render dashboard after the first deploy. Only one
# provider is needed; leave the other blank.
services:
  - type: web
    name: coreos
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Configure one provider. Anthropic wins if both are set.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
